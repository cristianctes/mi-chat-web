<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Mi Chat Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PANTALLA DE INGRESO -->
    <div id="login-container">
        <h2>Ingresar al Chat</h2>
        <input type="text" id="username" placeholder="Tu Apodo / Nickname" autocomplete="off">
        <select id="room">
            <option value="Chaco-Corrientes">Chaco-Corrientes</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Sala General">Sala General</option>
        </select>
        <button id="join-btn">Entrar a la Sala</button>
    </div>

    <!-- PANTALLA DEL CHAT -->
    <div class="chat-container" id="chat-container" style="display: none;">
        <div class="chat-header">
            <span id="current-room-title">Sala</span>
        </div>

        <!-- Banner de publicidad para mobile (arriba de los mensajes) -->
        <div class="mobile-ad-banner">
            <span class="ad-label">PUBLICIDAD</span>
            <div class="ad-box ad-box-mobile" id="ad-slot-mobile">Espacio publicitario 320x50</div>
        </div>

        <!-- Contenedor principal que divide el chat de las barras laterales -->
        <div class="chat-main-area">

            <!-- BARRA LATERAL IZQUIERDA: ANUNCIOS (desktop) -->
            <div class="ads-sidebar">
                <span class="ad-label">PUBLICIDAD</span>
                <div class="ad-box" id="ad-slot-1">Espacio publicitario 160x300</div>
                <span class="ad-label">PUBLICIDAD</span>
                <div class="ad-box" id="ad-slot-2">Espacio publicitario 160x300</div>
            </div>

            <div class="chat-messages-area">
                <ul id="messages"></ul>
                <form id="form" action="">
                    <label id="attach-btn" for="image-input" title="Enviar imagen">📷</label>
                    <input type="file" id="image-input" accept="image/*" style="display:none;">
                    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <!-- BARRA LATERAL DERECHA: USUARIOS -->
            <div class="users-sidebar">
                <h3>Conectados</h3>
                <ul id="users-list"></ul>
            </div>
        </div>
    </div>

    <!-- VENTANA FLOTANTE DE CHAT PRIVADO -->
    <div id="private-chat-modal" style="display:none;">
        <div class="private-header">
            <span id="private-chat-title">Chat privado</span>
            <button id="close-private-btn">✕</button>
        </div>
        <ul id="private-messages"></ul>
        <form id="private-form">
            <input id="private-input" autocomplete="off" placeholder="Mensaje privado..." />
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginContainer = document.getElementById('login-container');
        const chatContainer = document.getElementById('chat-container');
        const usernameInput = document.getElementById('username');
        const roomSelect = document.getElementById('room');
        const joinBtn = document.getElementById('join-btn');
        const currentRoomTitle = document.getElementById('current-room-title');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');
        const imageInput = document.getElementById('image-input');
        const attachBtn = document.getElementById('attach-btn');

        // Elementos del chat privado
        const privateModal = document.getElementById('private-chat-modal');
        const privateTitle = document.getElementById('private-chat-title');
        const privateMessagesList = document.getElementById('private-messages');
        const privateForm = document.getElementById('private-form');
        const privateInput = document.getElementById('private-input');
        const closePrivateBtn = document.getElementById('close-private-btn');

        let miNombre = "";
        let miSala = "";
        let miId = null; // socket.id propio, para no poder chatear con uno mismo

        // { socketId: { username, unread: number } } — conversaciones privadas abiertas
        let conversacionActual = null; // socketId con el que estoy chateando ahora

        socket.on('connect', () => {
            miId = socket.id;
        });

        // Evita inyección de HTML en nombres/mensajes
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Detecta si un texto es una URL de imagen (imgbb u otras)
        function esUrlDeImagen(texto) {
            return /^https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?$/i.test(texto.trim());
        }

        // Arma el HTML de un mensaje: si es imagen, se muestra SOLO como link (no se auto-embebe)
        function contenidoMensaje(texto) {
            if (esUrlDeImagen(texto)) {
                return `<a href="${texto}" target="_blank" rel="noopener" class="image-link">🖼️ Ver imagen (click para abrir)</a>`;
            }
            return escapeHTML(texto);
        }

        joinBtn.addEventListener('click', entrarASala);
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') entrarASala();
        });

        function entrarASala() {
            miNombre = usernameInput.value.trim();
            miSala = roomSelect.value;

            if (miNombre === "") {
                alert("Por favor, ingresá un nombre.");
                return;
            }

            loginContainer.style.display = "none";
            chatContainer.style.display = "flex";
            currentRoomTitle.textContent = `Sala: ${miSala}`;

            socket.emit('join room', { username: miNombre, room: miSala });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', {
                    text: input.value.trim(),
                    username: miNombre,
                    room: miSala
                });
                input.value = '';
            }
        });

        // Click en el ícono de cámara abre el selector de archivos
        attachBtn.addEventListener('click', () => imageInput.click());

        // Al elegir un archivo, se sube vía el servidor propio (/upload) y se envía SOLO el link
        imageInput.addEventListener('change', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            attachBtn.textContent = "⏳";

            try {
                const formData = new FormData();
                formData.append('image', file);

                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    socket.emit('chat message', {
                        text: data.url,
                        username: miNombre,
                        room: miSala
                    });
                } else {
                    alert(data.error || "No se pudo subir la imagen. Probá de nuevo.");
                }
            } catch (err) {
                console.error(err);
                alert("Error al subir la imagen.");
            } finally {
                attachBtn.textContent = "📷";
                imageInput.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            if (data.username === "Sistema") {
                item.innerHTML = `<em>${escapeHTML(data.text)}</em>`;
                item.classList.add('system-message');
            } else {
                item.innerHTML = `<strong>${escapeHTML(data.username)}:</strong> ${contenidoMensaje(data.text)}`;
            }
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        // ESCUCHAR LA LISTA ACTUALIZADA DE USUARIOS EN LA SALA
        socket.on('room users', (users) => {
            usersList.innerHTML = ''; // Limpiar la lista anterior
            users.forEach(user => {
                if (user.id === miId) return; // no me muestro a mí mismo en la lista clickeable... 
                // (si preferís verte listado también, sacá el "return" de arriba)
                const li = document.createElement('li');
                li.classList.add('clickable-user');
                li.dataset.id = user.id;
                li.innerHTML = `🟢 <span>${escapeHTML(user.username)}</span>`;
                li.addEventListener('click', () => abrirChatPrivado(user.id, user.username));
                usersList.appendChild(li);
            });
        });

        // ---- CHAT PRIVADO ----

        function abrirChatPrivado(idDestino, nombreDestino) {
            conversacionActual = idDestino;
            privateTitle.textContent = `💬 ${nombreDestino}`;
            privateModal.dataset.targetId = idDestino;
            privateModal.dataset.targetName = nombreDestino;
            privateModal.style.display = "flex";
            privateInput.focus();
        }

        closePrivateBtn.addEventListener('click', () => {
            privateModal.style.display = "none";
            conversacionActual = null;
        });

        privateForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const texto = privateInput.value.trim();
            const destinoId = privateModal.dataset.targetId;
            if (!texto || !destinoId) return;

            socket.emit('private message', {
                to: destinoId,
                from: miNombre,
                text: texto
            });

            // Mostrar mi propio mensaje en la ventana (el server no me lo reenvía a mí)
            agregarMensajePrivado(`Yo: ${contenidoMensaje(texto)}`, true);
            privateInput.value = '';
        });

        socket.on('private message', (data) => {
            // Si no tengo abierta la conversación con esa persona, la abro
            if (conversacionActual !== data.fromId) {
                abrirChatPrivado(data.fromId, data.from);
            }
            agregarMensajePrivado(`<strong>${escapeHTML(data.from)}:</strong> ${contenidoMensaje(data.text)}`, false);
        });

        function agregarMensajePrivado(html, esMio) {
            const li = document.createElement('li');
            li.innerHTML = html;
            if (esMio) li.style.background = "var(--accent)";
            privateMessagesList.appendChild(li);
            privateMessagesList.scrollTop = privateMessagesList.scrollHeight;
        }
    </script>
</body>
</html>
