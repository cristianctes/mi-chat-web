<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Chat Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-container">
    <div class="login-brand">Mi Chat</div>
    <h2>Ingresar al Chat</h2>
    <input type="text" id="username" placeholder="Tu Apodo / Nickname" autocomplete="off">
    <select id="room">
      <option value="Chaco-Corrientes">Chaco-Corrientes</option>
      <option value="Buenos Aires">Buenos Aires</option>
      <option value="Sala General">Sala General</option>
    </select>
    <button id="join-btn">Entrar a la Sala</button>
  </div>

  <div class="chat-container" id="chat-container" style="display:none;">
    <header class="chat-header">
      <div class="desktop-brand">Mi Chat</div>
      <div class="room-heading">
        <button id="mobile-back" class="mobile-icon-btn" type="button" aria-label="Volver">‹</button>
        <div>
          <strong id="current-room-title"># Chaco-Corrientes</strong>
          <small id="mobile-view-subtitle">Sala general</small>
        </div>
      </div>
      <button id="mobile-users-button" class="mobile-icon-btn users-button" type="button" aria-label="Conexión de usuarios">👥</button>
    </header>

    <div class="mobile-ad-banner">
      <span class="ad-label">PUBLICIDAD</span>
      <div class="ad-box ad-box-mobile">Espacio publicitario 320x50</div>
    </div>

    <div class="chat-main-area">
      <aside class="left-sidebar">
        <section class="sidebar-block desktop-room-block">
          <div class="side-brand">webchat<br><span>MiChat</span></div>
          <select id="desktop-room-select" disabled>
            <option id="desktop-room-option"># Chaco-Corrientes</option>
          </select>
        </section>

        <section class="sidebar-block conversations-block">
          <h3>Conversaciones</h3>
          <ul id="conversations-list"></ul>
        </section>

        <section class="sidebar-block ads-sidebar">
          <span class="ad-label">PUBLICIDAD</span>
          <div class="ad-box">Espacio publicitario<br>160x300</div>
        </section>
      </aside>

      <main class="chat-messages-area">
        <div class="chat-view-bar">
          <button id="back-to-general" type="button" style="display:none;">← Sala</button>
          <div class="view-copy">
            <div id="chat-view-title"># Chaco-Corrientes</div>
            <div id="chat-view-subtitle">Mensajes públicos</div>
          </div>
        </div>

        <ul id="messages"></ul>

        <form id="form" action="">
          <label id="attach-btn" for="image-input" title="Enviar imagen">📷</label>
          <input type="file" id="image-input" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
          <input id="input" autocomplete="off" placeholder="Escribe un mensaje...">
          <button type="submit">➤</button>
        </form>
      </main>

      <aside class="users-sidebar desktop-users">
        <div class="users-title-row">
          <h3><span id="users-count">0</span> usuarios aquí</h3>
        </div>
        <ul id="users-list"></ul>
      </aside>
    </div>

    <button id="mobile-connection-bar" class="mobile-connection-bar" type="button">
      <span>✕</span>
      <strong>Conexión de usuarios</strong>
      <span id="mobile-unread-total" class="mobile-total-badge" hidden>0</span>
    </button>

    <section id="mobile-users-sheet" class="mobile-users-sheet" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <strong>Conexión de usuarios</strong>
        <button id="close-mobile-sheet" type="button">✕</button>
      </div>
      <div class="sheet-tabs">
        <button type="button" class="sheet-tab active" data-tab="chats">Chats</button>
        <button type="button" class="sheet-tab" data-tab="users">Conectados <span id="mobile-users-count">0</span></button>
      </div>
      <div class="sheet-panel active" id="mobile-chats-panel">
        <ul id="mobile-conversations-list"></ul>
      </div>
      <div class="sheet-panel" id="mobile-users-panel">
        <ul id="mobile-users-list"></ul>
      </div>
    </section>
    <div id="mobile-sheet-overlay" class="mobile-sheet-overlay" hidden></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const loginContainer = document.getElementById('login-container');
    const chatContainer = document.getElementById('chat-container');
    const usernameInput = document.getElementById('username');
    const roomSelect = document.getElementById('room');
    const joinBtn = document.getElementById('join-btn');
    const currentRoomTitle = document.getElementById('current-room-title');
    const desktopRoomOption = document.getElementById('desktop-room-option');

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const usersList = document.getElementById('users-list');
    const conversationsList = document.getElementById('conversations-list');
    const mobileUsersList = document.getElementById('mobile-users-list');
    const mobileConversationsList = document.getElementById('mobile-conversations-list');
    const imageInput = document.getElementById('image-input');
    const attachBtn = document.getElementById('attach-btn');
    const chatViewTitle = document.getElementById('chat-view-title');
    const chatViewSubtitle = document.getElementById('chat-view-subtitle');
    const mobileViewSubtitle = document.getElementById('mobile-view-subtitle');
    const backToGeneralBtn = document.getElementById('back-to-general');
    const mobileBackBtn = document.getElementById('mobile-back');
    const usersCount = document.getElementById('users-count');
    const mobileUsersCount = document.getElementById('mobile-users-count');
    const mobileUnreadTotal = document.getElementById('mobile-unread-total');

    const mobileConnectionBar = document.getElementById('mobile-connection-bar');
    const mobileUsersButton = document.getElementById('mobile-users-button');
    const mobileUsersSheet = document.getElementById('mobile-users-sheet');
    const mobileSheetOverlay = document.getElementById('mobile-sheet-overlay');
    const closeMobileSheetBtn = document.getElementById('close-mobile-sheet');
    const sheetTabs = [...document.querySelectorAll('.sheet-tab')];
    const mobileChatsPanel = document.getElementById('mobile-chats-panel');
    const mobileUsersPanel = document.getElementById('mobile-users-panel');

    let miNombre = '';
    let miSala = '';
    let miId = null;
    let activeView = { type: 'general', id: null };

    const generalMessages = [];
    const conversations = new Map();
    const connectedUsers = new Map();
    const nickColors = new Map();
    const palette = ['#5a97ff','#17c58b','#b06cff','#f15c9b','#d99d00','#00a7d6','#66a800','#e56f3d','#2f80ed','#b64acb'];

    socket.on('connect', () => { miId = socket.id; });

    function escapeHTML(value = '') {
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function esUrlDeImagen(texto = '') {
      return /^https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?$/i.test(String(texto).trim());
    }

    function contenidoMensaje(texto = '') {
      if (esUrlDeImagen(texto)) {
        const url = String(texto).trim();
        return `<a href="${url}" target="_blank" rel="noopener" class="image-link"><img src="${url}" class="chat-image" alt="Imagen enviada"><span>Ver imagen</span></a>`;
      }
      return `<span class="message-text">${escapeHTML(texto)}</span>`;
    }

    function getNickColor(name = '') {
      if (!nickColors.has(name)) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        nickColors.set(name, palette[Math.abs(hash) % palette.length]);
      }
      return nickColors.get(name);
    }

    function getConversation(id, username = 'Usuario') {
      if (!conversations.has(id)) {
        conversations.set(id, { id, username, unread: 0, online: true, messages: [] });
      }
      const conv = conversations.get(id);
      if (username) conv.username = username;
      return conv;
    }

    function reproducirSonidoNotificacion() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 900;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      } catch (e) {}
    }

    function updateViewHeader() {
      if (activeView.type === 'general') {
        chatViewTitle.textContent = `# ${miSala}`;
        chatViewSubtitle.textContent = 'Mensajes públicos';
        currentRoomTitle.textContent = `# ${miSala}`;
        mobileViewSubtitle.textContent = 'Sala general';
        backToGeneralBtn.style.display = 'none';
        mobileBackBtn.classList.remove('visible');
        input.placeholder = 'Escribe un mensaje...';
      } else {
        const conv = conversations.get(activeView.id);
        const name = conv?.username || 'Privado';
        chatViewTitle.textContent = name;
        chatViewSubtitle.textContent = conv?.online ? 'Chat privado · En línea' : 'Chat privado · Desconectado';
        currentRoomTitle.textContent = name;
        mobileViewSubtitle.textContent = conv?.online ? 'Privado · en línea' : 'Privado · desconectado';
        backToGeneralBtn.style.display = 'inline-flex';
        mobileBackBtn.classList.add('visible');
        input.placeholder = `Mensaje privado para ${name}...`;
      }
    }

    function renderMessages() {
      messages.innerHTML = '';
      const source = activeView.type === 'general' ? generalMessages : (conversations.get(activeView.id)?.messages || []);

      source.forEach(msg => {
        const li = document.createElement('li');
        if (msg.system) {
          li.className = 'system-message';
          li.textContent = msg.text;
        } else if (activeView.type === 'general') {
          const isMine = msg.userId === miId;
          li.className = 'general-message';
          li.innerHTML = `
            <button class="message-nick ${isMine ? 'my-nick' : ''}" ${isMine ? 'disabled' : ''}
              data-id="${msg.userId || ''}" data-name="${escapeHTML(msg.username)}"
              style="color:${getNickColor(msg.username)}">${escapeHTML(msg.username)}</button>
            <div class="general-bubble">${contenidoMensaje(msg.text)}</div>`;
        } else {
          li.className = `private-message-row ${msg.own ? 'own' : 'other'}`;
          li.innerHTML = `<div class="private-bubble"><strong>${escapeHTML(msg.own ? 'Yo' : msg.from)}</strong>${contenidoMensaje(msg.text)}</div>`;
        }
        messages.appendChild(li);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    function conversationItemHTML(conv) {
      return `<div class="item-copy"><strong>${escapeHTML(conv.username)}</strong><small>${conv.online ? 'en línea' : 'desconectado'}</small></div>${conv.unread ? `<span class="unread-badge">${conv.unread}</span>` : ''}`;
    }

    function userItemHTML(user) {
      const unread = conversations.get(user.id)?.unread || 0;
      return `<span class="online-dot"></span><div class="item-copy"><strong style="color:${getNickColor(user.username)}">${escapeHTML(user.username)}</strong></div>${unread ? `<span class="unread-label">${unread} msj${unread > 1 ? 's' : ''}</span>` : ''}`;
    }

    function renderConversationListInto(target) {
      target.innerHTML = '';
      const general = document.createElement('li');
      general.className = `side-item room-item ${activeView.type === 'general' ? 'active' : ''}`;
      general.innerHTML = `<span class="room-icon">💬</span><div class="item-copy"><strong>#${escapeHTML(miSala || 'Sala')}</strong><small>Sala general</small></div>`;
      general.addEventListener('click', openGeneral);
      target.appendChild(general);

      [...conversations.values()].sort((a,b) => (b.unread-a.unread) || a.username.localeCompare(b.username)).forEach(conv => {
        const li = document.createElement('li');
        li.className = `side-item ${activeView.type === 'private' && activeView.id === conv.id ? 'active' : ''}`;
        li.innerHTML = conversationItemHTML(conv);
        li.addEventListener('click', () => openPrivate(conv.id, conv.username));
        target.appendChild(li);
      });
    }

    function renderUserListInto(target) {
      target.innerHTML = '';
      [...connectedUsers.values()].forEach(user => {
        if (user.id === miId) return;
        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = userItemHTML(user);
        li.addEventListener('click', () => openPrivate(user.id, user.username));
        target.appendChild(li);
      });
    }

    function refreshLists() {
      renderConversationListInto(conversationsList);
      renderConversationListInto(mobileConversationsList);
      renderUserListInto(usersList);
      renderUserListInto(mobileUsersList);
      const count = [...connectedUsers.values()].filter(u => u.id !== miId).length;
      usersCount.textContent = count;
      mobileUsersCount.textContent = count;
      const unreadTotal = [...conversations.values()].reduce((sum, c) => sum + c.unread, 0);
      mobileUnreadTotal.hidden = unreadTotal === 0;
      mobileUnreadTotal.textContent = unreadTotal;
    }

    function openGeneral() {
      activeView = { type: 'general', id: null };
      updateViewHeader();
      renderMessages();
      refreshLists();
      closeMobileSheet();
    }

    function openPrivate(id, username) {
      const conv = getConversation(id, username);
      conv.unread = 0;
      activeView = { type: 'private', id };
      updateViewHeader();
      renderMessages();
      refreshLists();
      closeMobileSheet();
      input.focus();
    }

    function addPrivateMessage(id, username, text, own = false, system = false) {
      const conv = getConversation(id, username);
      conv.messages.push({ from: own ? miNombre : username, text, own, system });
      if (!own && !system && !(activeView.type === 'private' && activeView.id === id)) conv.unread += 1;
      if (activeView.type === 'private' && activeView.id === id) conv.unread = 0;
      refreshLists();
      if (activeView.type === 'private' && activeView.id === id) renderMessages();
    }

    function openMobileSheet(tab = 'chats') {
      mobileUsersSheet.classList.add('open');
      mobileUsersSheet.setAttribute('aria-hidden', 'false');
      mobileSheetOverlay.hidden = false;
      setMobileTab(tab);
    }

    function closeMobileSheet() {
      mobileUsersSheet.classList.remove('open');
      mobileUsersSheet.setAttribute('aria-hidden', 'true');
      mobileSheetOverlay.hidden = true;
    }

    function setMobileTab(tab) {
      sheetTabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
      mobileChatsPanel.classList.toggle('active', tab === 'chats');
      mobileUsersPanel.classList.toggle('active', tab === 'users');
    }

    sheetTabs.forEach(btn => btn.addEventListener('click', () => setMobileTab(btn.dataset.tab)));
    mobileConnectionBar.addEventListener('click', () => openMobileSheet('chats'));
    mobileUsersButton.addEventListener('click', () => openMobileSheet('users'));
    closeMobileSheetBtn.addEventListener('click', closeMobileSheet);
    mobileSheetOverlay.addEventListener('click', closeMobileSheet);
    mobileBackBtn.addEventListener('click', openGeneral);
    backToGeneralBtn.addEventListener('click', openGeneral);

    function entrarASala() {
      miNombre = usernameInput.value.trim();
      miSala = roomSelect.value;
      if (!miNombre) return alert('Por favor, ingresá un nombre.');
      loginContainer.style.display = 'none';
      chatContainer.style.display = 'flex';
      desktopRoomOption.textContent = `# ${miSala}`;
      updateViewHeader();
      refreshLists();
      socket.emit('join room', { username: miNombre, room: miSala });
    }

    joinBtn.addEventListener('click', entrarASala);
    usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') entrarASala(); });

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      if (activeView.type === 'general') {
        socket.emit('chat message', { text, username: miNombre, room: miSala });
      } else {
        const conv = conversations.get(activeView.id);
        if (!conv) return;
        socket.emit('private message', { to: activeView.id, toUsername: conv.username, text });
        addPrivateMessage(activeView.id, conv.username, text, true, false);
      }
      input.value = '';
    });

    attachBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', async () => {
      const file = imageInput.files[0];
      if (!file) return;
      attachBtn.textContent = '⏳';
      try {
        const fd = new FormData();
        fd.append('image', file);
        const response = await fetch('/upload', { method: 'POST', body: fd });
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'No se pudo subir la imagen.');
        if (activeView.type === 'general') {
          socket.emit('chat message', { text: data.url, username: miNombre, room: miSala });
        } else {
          const conv = conversations.get(activeView.id);
          if (!conv) return;
          socket.emit('private message', { to: activeView.id, toUsername: conv.username, text: data.url });
          addPrivateMessage(activeView.id, conv.username, data.url, true, false);
        }
      } catch (error) {
        alert(error.message || 'Error al subir la imagen.');
      } finally {
        attachBtn.textContent = '📷';
        imageInput.value = '';
      }
    });

    messages.addEventListener('click', e => {
      const nick = e.target.closest('.message-nick');
      if (!nick || nick.classList.contains('my-nick')) return;
      if (nick.dataset.id) openPrivate(nick.dataset.id, nick.dataset.name);
    });

    socket.on('chat message', data => {
      generalMessages.push({ username: data.username, userId: data.userId || null, text: data.text, system: data.username === 'Sistema' });
      if (activeView.type === 'general') renderMessages();
    });

    socket.on('room users', users => {
      const ids = new Set();
      connectedUsers.clear();
      users.forEach(user => {
        connectedUsers.set(user.id, user);
        ids.add(user.id);
        if (conversations.has(user.id)) conversations.get(user.id).online = true;
      });
      conversations.forEach(conv => { if (!ids.has(conv.id)) conv.online = false; });
      refreshLists();
      updateViewHeader();
    });

    socket.on('private message', data => {
      const wasOpen = activeView.type === 'private' && activeView.id === data.fromId;
      addPrivateMessage(data.fromId, data.from, data.text, false, false);
      if (!wasOpen) reproducirSonidoNotificacion();
    });

    socket.on('private unavailable', data => {
      const conv = getConversation(data.to, data.username || 'Usuario');
      conv.online = false;
      conv.messages.push({ from: 'Sistema', text: `${data.username || 'El usuario'} ya no está en la sala.`, own: false, system: true });
      refreshLists();
      updateViewHeader();
      if (activeView.type === 'private' && activeView.id === data.to) renderMessages();
    });

    socket.on('user left', data => {
      if (!data?.id) return;
      const conv = conversations.get(data.id);
      if (conv) {
        conv.online = false;
        conv.messages.push({ from: 'Sistema', text: `${data.username} ha abandonado la sala.`, own: false, system: true });
      }
      refreshLists();
      updateViewHeader();
      if (activeView.type === 'private' && activeView.id === data.id) renderMessages();
    });

    socket.on('banned', data => {
      alert(`${data.reason || 'Has sido bloqueado.'}${data.minutes ? `\nTiempo: ${data.minutes} minutos.` : ''}`);
      location.reload();
    });
  </script>
</body>
</html>
