<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Mi Chat Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PANTALLA DE INGRESO -->
    <div id="login-container">
        <h2>Ingresar al Chat</h2>
        <input type="text" id="username" placeholder="Tu Apodo / Nickname" autocomplete="off">
        <select id="room">
            <option value="Chaco-Corrientes">Chaco-Corrientes</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Sala General">Sala General</option>
        </select>
        <button id="join-btn">Entrar a la Sala</button>
    </div>

    <!-- PANTALLA DEL CHAT -->
    <div class="chat-container" id="chat-container" style="display: none;">
        <div class="chat-header">
            <span id="current-room-title">Sala</span>
        </div>

        <!-- Banner de publicidad para mobile (arriba de los mensajes) -->
        <div class="mobile-ad-banner">
            <span class="ad-label">PUBLICIDAD</span>
            <div class="ad-box ad-box-mobile" id="ad-slot-mobile">Espacio publicitario 320x50</div>
        </div>

        <!-- Contenedor principal que divide el chat de las barras laterales -->
        <div class="chat-main-area">

            <!-- BARRA LATERAL IZQUIERDA: ANUNCIOS (desktop) -->
            <div class="ads-sidebar">
                <span class="ad-label">PUBLICIDAD</span>
                <div class="ad-box" id="ad-slot-1">Espacio publicitario 160x300</div>
                <span class="ad-label">PUBLICIDAD</span>
                <div class="ad-box" id="ad-slot-2">Espacio publicitario 160x300</div>
            </div>

            <div class="chat-messages-area">
                <ul id="messages"></ul>
                <form id="form" action="">
                    <label id="attach-btn" for="image-input" title="Enviar imagen">📷</label>
                    <input type="file" id="image-input" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none;">
                    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <!-- BARRA LATERAL DERECHA: USUARIOS -->
            <div class="users-sidebar">
                <h3>Conectados</h3>
                <ul id="users-list"></ul>
            </div>
        </div>
    </div>

    <!-- DOCK DE CHATS PRIVADOS: las conversaciones se van acoplando acá, ancladas abajo a la derecha -->
    <div id="private-chat-dock"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginContainer = document.getElementById('login-container');
        const chatContainer = document.getElementById('chat-container');
        const usernameInput = document.getElementById('username');
        const roomSelect = document.getElementById('room');
        const joinBtn = document.getElementById('join-btn');
        const currentRoomTitle = document.getElementById('current-room-title');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');
        const imageInput = document.getElementById('image-input');
        const attachBtn = document.getElementById('attach-btn');
        const privateDock = document.getElementById('private-chat-dock');

        let miNombre = '';
        let miSala = '';
        let miId = null;
        let baneado = false;

        // id socket destino -> { username, unread, colapsado, elemento, online }
        const conversaciones = new Map();

        socket.on('connect', () => {
            miId = socket.id;
        });

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = String(str ?? '');
            return div.innerHTML;
        }

        function esUrlDeImagen(texto) {
            return /^https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?$/i.test(String(texto).trim());
        }

        function contenidoMensaje(texto) {
            if (esUrlDeImagen(texto)) {
                return `<a href="${escapeHTML(texto)}" target="_blank" rel="noopener" class="image-link">🖼️ Ver imagen (click para abrir)</a>`;
            }
            return escapeHTML(texto);
        }

        // Genera un color estable por nick para distinguir rápidamente quién escribe.
        function colorDeNick(nick) {
            let hash = 0;
            for (let i = 0; i < nick.length; i++) {
                hash = nick.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue} 78% 68%)`;
        }

        function archivoImagenValido(file) {
            const tipos = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            return file && tipos.includes(file.type) && file.size <= 5 * 1024 * 1024;
        }

        async function subirImagen(file) {
            if (!archivoImagenValido(file)) {
                throw new Error('Solo podés enviar imágenes JPG, PNG, GIF o WEBP de hasta 5 MB.');
            }
            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo subir la imagen.');
            return data.url;
        }

        let audioCtx = null;
        function reproducirSonidoNotificacion() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 900;
                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
            } catch (err) {}
        }

        joinBtn.addEventListener('click', entrarASala);
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') entrarASala();
        });

        function entrarASala() {
            if (baneado) return;
            miNombre = usernameInput.value.trim();
            miSala = roomSelect.value;
            if (!miNombre) {
                alert('Por favor, ingresá un nombre.');
                return;
            }
            loginContainer.style.display = 'none';
            chatContainer.style.display = 'flex';
            currentRoomTitle.textContent = `Sala: ${miSala}`;
            socket.emit('join room', { username: miNombre, room: miSala });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const texto = input.value.trim();
            if (!texto || baneado) return;
            socket.emit('chat message', { text: texto, room: miSala });
            input.value = '';
        });

        attachBtn.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', async () => {
            const file = imageInput.files[0];
            if (!file || baneado) return;
            attachBtn.textContent = '⏳';
            try {
                const url = await subirImagen(file);
                socket.emit('chat message', { text: url, room: miSala });
            } catch (err) {
                alert(err.message);
            } finally {
                attachBtn.textContent = '📷';
                imageInput.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');

            if (data.username === 'Sistema') {
                const em = document.createElement('em');
                em.textContent = data.text;
                item.appendChild(em);
                item.classList.add('system-message');
            } else {
                const nick = document.createElement('button');
                nick.type = 'button';
                nick.className = 'message-nick';
                nick.textContent = `${data.username}:`;
                nick.style.color = colorDeNick(data.username);

                if (data.userId && data.userId !== miId) {
                    nick.title = `Enviar mensaje privado a ${data.username}`;
                    nick.addEventListener('click', () => abrirChatPrivado(data.userId, data.username));
                } else {
                    nick.classList.add('my-nick');
                }

                const contenido = document.createElement('span');
                contenido.className = 'message-text';
                contenido.innerHTML = contenidoMensaje(data.text);

                item.appendChild(nick);
                item.appendChild(document.createTextNode(' '));
                item.appendChild(contenido);
            }

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('room users', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                if (user.id === miId) return;
                const conv = conversaciones.get(user.id);
                const tieneNoLeidos = conv && conv.unread > 0;

                const li = document.createElement('li');
                li.classList.add('clickable-user');
                li.dataset.id = user.id;
                li.innerHTML = `🟢 <span>${escapeHTML(user.username)}</span><span class="unread-dot" style="display:${tieneNoLeidos ? 'inline-block' : 'none'}"></span>`;
                li.addEventListener('click', () => abrirChatPrivado(user.id, user.username));
                usersList.appendChild(li);

                if (conv) {
                    conv.online = true;
                    habilitarChatPrivado(user.id, true);
                }
            });
        });

        const esMobile = () => window.matchMedia('(max-width: 800px)').matches;

        function actualizarPuntoNoLeido(id) {
            const li = usersList.querySelector(`li[data-id="${id}"]`);
            if (!li) return;
            const conv = conversaciones.get(id);
            const punto = li.querySelector('.unread-dot');
            if (punto) punto.style.display = (conv && conv.unread > 0) ? 'inline-block' : 'none';
        }

        function crearVentanaPrivada(id, username) {
            const win = document.createElement('div');
            win.className = 'private-chat-window';
            win.dataset.id = id;
            win.innerHTML = `
                <div class="private-header">
                    <span class="private-username">💬 ${escapeHTML(username)}</span>
                    <span class="unread-badge" style="display:none">0</span>
                    <button class="close-private-btn" title="Cerrar">✕</button>
                </div>
                <ul class="private-messages"></ul>
                <form class="private-form">
                    <button type="button" class="private-attach-btn" title="Enviar imagen">📷</button>
                    <input type="file" class="private-image-input" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                    <input class="private-input" autocomplete="off" placeholder="Mensaje privado..." />
                    <button type="submit" class="private-send-btn">Enviar</button>
                </form>
            `;

            win.querySelector('.private-header').addEventListener('click', (e) => {
                if (e.target.closest('.close-private-btn')) return;
                toggleColapsarVentana(id);
            });

            win.querySelector('.close-private-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                cerrarChatPrivado(id);
            });

            const privateForm = win.querySelector('.private-form');
            privateForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const inputEl = win.querySelector('.private-input');
                const texto = inputEl.value.trim();
                const conv = conversaciones.get(id);
                if (!texto || baneado || (conv && conv.online === false)) return;

                socket.emit('private message', { to: id, toUsername: username, text: texto });
                agregarMensajePrivado(id, `Yo: ${contenidoMensaje(texto)}`, true);
                inputEl.value = '';
            });

            const attachPrivate = win.querySelector('.private-attach-btn');
            const filePrivate = win.querySelector('.private-image-input');
            attachPrivate.addEventListener('click', () => filePrivate.click());
            filePrivate.addEventListener('change', async () => {
                const file = filePrivate.files[0];
                const conv = conversaciones.get(id);
                if (!file || baneado || (conv && conv.online === false)) return;
                const original = attachPrivate.textContent;
                attachPrivate.textContent = '⏳';
                attachPrivate.disabled = true;
                try {
                    const url = await subirImagen(file);
                    socket.emit('private message', { to: id, toUsername: username, text: url });
                    agregarMensajePrivado(id, `Yo: ${contenidoMensaje(url)}`, true);
                } catch (err) {
                    alert(err.message);
                } finally {
                    attachPrivate.textContent = original;
                    attachPrivate.disabled = false;
                    filePrivate.value = '';
                }
            });

            if (esMobile()) {
                [...conversaciones.keys()].forEach(otroId => {
                    if (otroId !== id) cerrarChatPrivado(otroId);
                });
            }

            privateDock.appendChild(win);
            return win;
        }

        function abrirChatPrivado(idDestino, nombreDestino) {
            if (!idDestino || idDestino === miId) return;
            let conv = conversaciones.get(idDestino);

            if (!conv) {
                conv = { username: nombreDestino, unread: 0, colapsado: false, elemento: null, online: true };
                conv.elemento = crearVentanaPrivada(idDestino, nombreDestino);
                conversaciones.set(idDestino, conv);
            } else {
                conv.colapsado = false;
                conv.elemento.classList.remove('collapsed');
            }

            conv.unread = 0;
            actualizarBadge(idDestino);
            actualizarPuntoNoLeido(idDestino);
            conv.elemento.querySelector('.private-input').focus();
        }

        function toggleColapsarVentana(id) {
            const conv = conversaciones.get(id);
            if (!conv) return;
            conv.colapsado = !conv.colapsado;
            conv.elemento.classList.toggle('collapsed', conv.colapsado);
            if (!conv.colapsado) {
                conv.unread = 0;
                actualizarBadge(id);
                actualizarPuntoNoLeido(id);
            }
        }

        function cerrarChatPrivado(id) {
            const conv = conversaciones.get(id);
            if (!conv) return;
            conv.elemento.remove();
            conversaciones.delete(id);
            actualizarPuntoNoLeido(id);
        }

        function actualizarBadge(id) {
            const conv = conversaciones.get(id);
            if (!conv) return;
            const badge = conv.elemento.querySelector('.unread-badge');
            if (conv.unread > 0) {
                badge.textContent = conv.unread;
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function habilitarChatPrivado(id, habilitado) {
            const conv = conversaciones.get(id);
            if (!conv) return;
            conv.online = habilitado;
            const inputEl = conv.elemento.querySelector('.private-input');
            const sendBtn = conv.elemento.querySelector('.private-send-btn');
            const attachBtnPriv = conv.elemento.querySelector('.private-attach-btn');
            inputEl.disabled = !habilitado;
            sendBtn.disabled = !habilitado;
            attachBtnPriv.disabled = !habilitado;
            inputEl.placeholder = habilitado ? 'Mensaje privado...' : 'Usuario desconectado';
        }

        socket.on('private message', (data) => {
            let conv = conversaciones.get(data.fromId);

            if (!conv) {
                const elemento = crearVentanaPrivada(data.fromId, data.from);
                elemento.classList.add('collapsed');
                conv = { username: data.from, unread: 0, colapsado: true, elemento, online: true };
                conversaciones.set(data.fromId, conv);
            }

            agregarMensajePrivado(data.fromId, `<strong>${escapeHTML(data.from)}:</strong> ${contenidoMensaje(data.text)}`, false);

            if (conv.colapsado) {
                conv.unread++;
                actualizarBadge(data.fromId);
                actualizarPuntoNoLeido(data.fromId);
            }
            reproducirSonidoNotificacion();
        });

        socket.on('private unavailable', (data) => {
            const conv = conversaciones.get(data.to);
            if (conv) {
                agregarMensajePrivado(data.to, `<em>⚠️ ${escapeHTML(conv.username)} ya no está en la sala.</em>`, false, true);
                habilitarChatPrivado(data.to, false);
            }
        });

        // Cuando alguien abandona, avisa también dentro del chat privado que estuviera abierto.
        socket.on('user left', (data) => {
            const conv = conversaciones.get(data.id);
            if (!conv) return;
            agregarMensajePrivado(data.id, `<em>⬅️ ${escapeHTML(data.username)} ha abandonado la sala.</em>`, false, true);
            habilitarChatPrivado(data.id, false);
        });

        socket.on('banned', (data) => {
            baneado = true;
            const minutos = data.minutes ? ` por ${data.minutes} minutos` : '';
            alert(`Fuiste expulsado del chat${minutos}. ${data.reason || ''}`);
            input.disabled = true;
            attachBtn.style.pointerEvents = 'none';
            document.querySelector('#form button[type="submit"]').disabled = true;
            conversaciones.forEach((conv, id) => habilitarChatPrivado(id, false));
        });

        function agregarMensajePrivado(id, html, esMio, esSistema = false) {
            const conv = conversaciones.get(id);
            if (!conv) return;
            const li = document.createElement('li');
            li.innerHTML = html;
            if (esMio) li.classList.add('private-own-message');
            if (esSistema) li.classList.add('private-system-message');
            const lista = conv.elemento.querySelector('.private-messages');
            lista.appendChild(li);
            lista.scrollTop = lista.scrollHeight;
        }
    </script>
</body>
</html>
