<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chat Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PANTALLA DE INGRESO -->
    <div id="login-container">
        <h2>Ingresar al Chat</h2>
        <input type="text" id="username" placeholder="Tu Apodo / Nickname" autocomplete="off">
        <select id="room">
            <option value="Chaco-Corrientes">Chaco-Corrientes</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Sala General">Sala General</option>
        </select>
        <button id="join-btn">Entrar a la Sala</button>
    </div>

    <!-- PANTALLA DEL CHAT -->
    <div class="chat-container" id="chat-container" style="display: none;">
        <!-- Encabezado dinámico con botón para volver al chat público -->
        <div class="chat-header">
            <span id="current-room-title">Sala</span>
            <button id="back-to-public-btn" style="display: none;">Volver al Chat Público</button>
        </div>
        
        <div class="chat-main-area">
            <!-- PUBLICIDAD -->
            <div class="ads-sidebar">
                <span class="ad-label">PUBLICIDAD</span>
                <div class="ad-box">
                    <p>¡Tu Anuncio Aquí!</p>
                    <small>Contacto: tu-email@chat.com</small>
                </div>
            </div>

            <!-- ÁREA DE MENSAJES CENTRAL -->
            <div class="chat-messages-area">
                <!-- Contenedor del Chat Público -->
                <ul id="messages"></ul>

                <!-- Contenedor del Chat Privado (Oculto al inicio) -->
                <ul id="private-messages" style="display: none;"></ul>

                <!-- Formulario Único de Envío -->
                <form id="form" action="">
                    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                    <button id="send-btn">Enviar</button>
                </form>
            </div>
            
            <!-- BARRA LATERAL: USUARIOS -->
            <div class="users-sidebar">
                <h3>Conectados</h3>
                <ul id="users-list"></ul>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginContainer = document.getElementById('login-container');
        const chatContainer = document.getElementById('chat-container');
        const usernameInput = document.getElementById('username');
        const roomSelect = document.getElementById('room');
        const joinBtn = document.getElementById('join-btn');
        const currentRoomTitle = document.getElementById('current-room-title');
        const backToPublicBtn = document.getElementById('back-to-public-btn');
        
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const privateMessages = document.getElementById('private-messages');
        const usersList = document.getElementById('users-list');

        let miNombre = "";
        let miSala = "";
        let targetSocketId = ""; // ID del usuario privado actual
        let targetUsername = ""; // Nombre del usuario privado actual
        let modoChat = "publico"; // Puede ser "publico" o "privado"

        joinBtn.addEventListener('click', () => {
            miNombre = usernameInput.value.trim();
            miSala = roomSelect.value;
            if (miNombre === "") return alert("Ingresa un nombre.");
            loginContainer.style.display = "none";
            chatContainer.style.display = "flex";
            currentRoomTitle.textContent = `Sala: ${miSala}`;
            socket.emit('join room', { username: miNombre, room: miSala });
        });

        // MANEJO DEL ENVÍO DE MENSAJES (Detecta si es público o privado)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!input.value) return;

            if (modoChat === "publico") {
                socket.emit('chat message', { text: input.value, username: miNombre, room: miSala });
            } else if (modoChat === "privado" && targetSocketId) {
                const texto = input.value;
                socket.emit('private message', { to: targetSocketId, text: texto, from: miNombre });
                
                // Agregarlo visualmente a mi pantalla de chat privado
                const item = document.createElement('li');
                item.className = "my-private-msg";
                item.innerHTML = `<strong>Yo (Privado):</strong> ${texto}`;
                privateMessages.appendChild(item);
                privateMessages.scrollTop = privateMessages.scrollHeight;
            }
            input.value = '';
        });

        // RECIBIR MENSAJES PÚBLICOS
        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            if (data.username === "Sistema") {
                item.innerHTML = `<em>${data.text}</em>`;
                item.style.backgroundColor = "#2a2b36";
                item.style.color = "#a0a5b5";
            } else {
                item.innerHTML = `<strong>${data.username}:</strong> ${data.text}`;
            }
            messages.appendChild(item);
            if (modoChat === "publico") messages.scrollTop = messages.scrollHeight;
        });

        // RECIBIR LA LISTA DE USUARIOS
        socket.on('room users', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                if (user.username === miNombre) return;

                const li = document.createElement('li');
                li.setAttribute('data-id', user.id);
                li.innerHTML = `🟢 <span class="clickable-user">${user.username}</span>`;
                
                // Si ya estábamos hablando con él, mantenemos el color de activo
                if (user.id === targetSocketId) {
                    li.classList.add('active-private-user');
                }

                // Evento al hacer clic en un usuario para hablar en privado
                li.addEventListener('click', () => {
                    // Remover color activo de cualquier otro usuario previo
                    document.querySelectorAll('#users-list li').forEach(el => el.classList.remove('active-private-user'));
                    
                    // Asignar datos del nuevo objetivo privado
                    targetSocketId = user.id;
                    targetUsername = user.username;
                    li.classList.add('active-private-user');

                    // Cambiar la vista de la columna central
                    modoChat = "privado";
                    currentRoomTitle.textContent = `Conversación Privada con: ${targetUsername}`;
                    backToPublicBtn.style.display = "inline-block";
                    messages.style.display = "none";
                    privateMessages.style.display = "block";
                    input.placeholder = `Escribe un mensaje privado a ${targetUsername}...`;
                    privateMessages.innerHTML = ""; // Limpiar pantalla para iniciar conversación limpia
                });

                usersList.appendChild(li);
            });
        });

        // RECIBIR MENSAJE PRIVADO ENTRANTE
        socket.on('private message', (data) => {
            // Si no estamos en modo privado con esa persona, lo cambiamos automáticamente
            if (targetSocketId !== data.fromId) {
                targetSocketId = data.fromId;
                targetUsername = data.from;
                
                // Resaltar visualmente en la lista de la derecha
                document.querySelectorAll('#users-list li').forEach(el => {
                    if (el.getAttribute('data-id') === data.fromId) {
                        el.classList.add('active-private-user');
                    } else {
                        el.classList.remove('active-private-user');
                    }
                });

                modoChat = "privado";
                currentRoomTitle.textContent = `Conversación Privada con: ${targetUsername}`;
                backToPublicBtn.style.display = "inline-block";
                messages.style.display = "none";
                privateMessages.style.display = "block";
                input.placeholder = `Escribe un mensaje privado a ${targetUsername}...`;
                privateMessages.innerHTML = "";
            }

            // Dibujar el mensaje recibido
            const item = document.createElement('li');
            item.className = "incoming-private-msg";
            item.innerHTML = `<strong>${data.from} (Privado):</strong> ${data.text}`;
            privateMessages.appendChild(item);
            privateMessages.scrollTop = privateMessages.scrollHeight;
        });

        // BOTÓN PARA VOLVER AL CHAT DE LA SALA PÚBLICA
        backToPublicBtn.addEventListener('click', () => {
            document.querySelectorAll('#users-list li').forEach(el => el.classList.remove('active-private-user'));
            modoChat = "publico";
            targetSocketId = "";
            targetUsername = "";
            
            currentRoomTitle.textContent = `Sala: ${miSala}`;
            backToPublicBtn.style.display = "none";
            privateMessages.style.display = "none";
            messages.style.display = "block";
            input.placeholder = "Escribe un mensaje...";
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
