<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Comunidad Chat</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="style-v4.css"></head>
<body><div id="login" class="login"><form id="loginForm"><h1>Entrar al chat</h1><input id="nick" maxlength="24" placeholder="Tu nick" required><select id="initialChannel"></select><button>Ingresar</button><p id="loginError"></p></form></div>
<div id="app" class="app hidden">
 <aside class="left"><label class="channelLabel" for="desktopChannel">CANAL PÚBLICO</label><select id="desktopChannel" class="channelSelect"></select><button id="publicRoom" class="publicRoom">💬 Volver a la sala pública</button><h2>Chats privados</h2><div id="chats"></div><div class="ad">PUBLICIDAD<br><span>Espacio publicitario</span></div></aside>
 <main><header><div><h1 id="title"># Chaco-Corrientes</h1><small id="subtitle">Sala general</small></div><button id="peopleBtn" class="people" aria-label="Usuarios">👥</button></header><div class="mobileChannels"><select id="mobileChannel"></select></div><div id="messages" class="messages"></div><form id="composer"><label class="camera">📷<input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label><input id="text" maxlength="1000" autocomplete="off" placeholder="Escribe un mensaje..."><button class="send">➤</button></form></main>
 <aside class="right"><h2>Conectados</h2><div id="users"></div></aside>
 <button id="mobileBar" class="mobileBar">☰ &nbsp; Conexión de usuarios <b id="totalUnread">0</b></button>
 <div id="backdrop" class="backdrop" hidden></div><section id="sheet" class="sheet" aria-hidden="true"><div class="sheetHead"><strong>Conexión de usuarios</strong><button id="closeSheet">×</button></div><div class="tabs"><button data-tab="mobileChats">Chats</button><button data-tab="mobileUsers" class="active">Conectados</button></div><div id="mobileChats" class="mobileList"></div><div id="mobileUsers" class="mobileList active"></div></section>
</div><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
